<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier une annonce - UniversMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 pb-24 transition-colors duration-300">

    <header class="bg-blue-600 dark:bg-blue-900 p-4 text-white shadow-md flex items-center transition-colors duration-300">
        <a href="index.html" class="mr-3 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="font-bold text-lg">Publier une annonce</h1>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <!-- Message de vérification de sécurité en attendant -->
        <div id="securityLoading" class="text-center py-10 text-gray-400 text-xs">
            Vérification de votre session...
        </div>

        <!-- Formulaire masqué tant que l'utilisateur n'est pas authentifié -->
        <form id="postForm" class="hidden bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-4 transition-colors duration-300">
            
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Titre de l'annonce</label>
                <input type="text" id="title" required placeholder="Ex: iPhone 13 Pro Max 256Go" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Prix ($ USD)</label>
                    <input type="number" id="priceUSD" required placeholder="Ex: 450" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Catégorie</label>
                    <select id="category" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
                        <option value="Telephones">Téléphones</option>
                        <option value="Electro">Électronique</option>
                        <option value="Meubles">Meubles</option>
                        <option value="Vehicules">Véhicules</option>
                        <option value="Mode">Mode & Vêtements</option>
                    </select>
                </div>
            </div>

            <!-- Localisation RDC (26 Provinces) -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Province</label>
                    <select id="provinceSelect" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
                        <!-- Rempli dynamiquement par script -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ville / Commune</label>
                    <input type="text" id="city" required placeholder="Ex: Gombe, Lubumbashi..." class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Numéro WhatsApp</label>
                <input type="tel" id="phone" required placeholder="Ex: +243820000000" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Lien de l'image (URL)</label>
                <input type="url" id="image" required placeholder="https://exemple.com/image.jpg" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl text-sm shadow-lg transition">
                Publier l'annonce
            </button>
        </form>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center py-2 text-gray-400 z-50 shadow-lg transition-colors duration-300">
        <a href="index.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Accueil</span>
        </a>
        <a href="rechercher.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Rechercher</span>
        </a>
        <a href="publier.html" class="bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center -mt-5 shadow-lg">
            <i class="fa-solid fa-plus text-xl"></i>
        </a>
        <a href="favoris.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-heart text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Favoris</span>
        </a>
        <a href="compte.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Compte</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8",
            authDomain: "universmarket-5834b.firebaseapp.com",
            projectId: "universmarket-5834b",
            storageBucket: "universmarket-5834b.appspot.com",
            messagingSenderId: "921170766621",
            appId: "1:921170766621:web:a4fdd73b9492d47a748c96"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 🛡️ SÉCURITÉ DE PUBLICATION
        let connectedUserEmail = "";

        onAuthStateChanged(auth, (user) => {
            const loadingDiv = document.getElementById('securityLoading');
            const formElement = document.getElementById('postForm');

            if (!user) {
                // Si l'utilisateur n'est pas connecté, alerte et redirection vers la page de connexion
                alert("Accès refusé ! Vous devez être connecté pour publier une annonce.");
                window.location.href = "compte.html";
            } else {
                // S'il est connecté, on mémorise son email et on affiche le formulaire de publication
                connectedUserEmail = user.email;
                loadingDiv.classList.add('hidden');
                formElement.classList.remove('hidden');
            }
        });

        // Les 26 provinces de la RDC
        const provincesRDC = [
            "Kinshasa", "Haut-Katanga", "Lualaba", "Nord-Kivu", "Sud-Kivu", 
            "Kongo-Central", "Kasai", "Kasai-Central", "Kasai-Oriental", "Lomami", 
            "Sankuru", "Tanganyika", "Haut-Lomami", "Maniema", "Bas-Uele", 
            "Haut-Uele", "Ituri", "Tshopo", "Equateur", "Nord-Ubangi", 
            "Sud-Ubangi", "Mongala", "Tshuapa", "Kwango", "Kwilu", "Mai-Ndombe"
        ];

        const provinceSelect = document.getElementById('provinceSelect');
        provincesRDC.sort().forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            if(prov === "Kinshasa") opt.selected = true;
            provinceSelect.appendChild(opt);
        });

        // Gestion de la soumission du formulaire
        const form = document.getElementById('postForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Publication en cours...";

            try {
                await addDoc(collection(db, 'annonces'), {
                    title: document.getElementById('title').value,
                    priceUSD: parseFloat(document.getElementById('priceUSD').value),
                    category: document.getElementById('category').value,
                    province: document.getElementById('provinceSelect').value,
                    city: document.getElementById('city').value.trim(),
                    phone: document.getElementById('phone').value,
                    image: document.getElementById('image').value,
                    userEmail: connectedUserEmail, // Enregistre l'email du propriétaire
                    createdAt: serverTimestamp()
                });

                alert("Annonce publiée avec succès !");
                window.location.href = "index.html";
            } catch (error) {
                console.error("Erreur:", error);
                alert("Erreur lors de la publication.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Publier l'annonce";
            }
        });
    </script>
</body>
</html>
