<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniversMarket</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 p-4 text-white text-center font-bold text-xl">
        UniversMarket
    </header>

    <!-- Conteneur des annonces -->
    <main class="p-4">
        <div id="adsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Les annonces s'afficheront ici -->
        </div>
        <div id="emptyAdsMessage" class="hidden text-center text-gray-500 mt-10">
            Aucune annonce pour le moment.
        </div>
    </main>

    <!-- Script Firebase & Logique -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8",
            authDomain: "universmarket-5834b.firebaseapp.com",
            projectId: "universmarket-5834b",
            storageBucket: "universmarket-5834b.appspot.com",
            messagingSenderId: "921170766621",
            appId: "1:921170766621:web:a4fdd73b9492d47a748c96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Rendu des annonces
        window.renderAds = function(ads) {
            const container = document.getElementById('adsContainer');
            const emptyMsg = document.getElementById('emptyAdsMessage');
            
            if (ads.length === 0) {
                emptyMsg.classList.remove('hidden');
                container.innerHTML = '';
                return;
            }

            emptyMsg.classList.add('hidden');
            container.innerHTML = ads.map(ad => `
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <img src="${ad.image || ''}" class="w-full h-40 object-cover rounded-lg mb-2">
                    <h4 class="font-bold text-lg">${ad.title || 'Sans titre'}</h4>
                    <p class="text-blue-600 font-bold">$${ad.priceUSD || 0}</p>
                </div>
            `).join('');
        };

        // Chargement des données
        const q = query(collection(db, 'annonces'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
            let ads = [];
            snapshot.forEach((doc) => ads.push({ id: doc.id, ...doc.data() }));
            renderAds(ads);
        });
    </script>
</body>
</html>
