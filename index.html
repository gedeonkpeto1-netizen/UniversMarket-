<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniversMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-24">

    <!-- Header -->
    <header class="bg-blue-600 p-4 text-white shadow-lg">
        <h1 class="font-bold text-xl">UniversMarket</h1>
        <input type="text" placeholder="Rechercher..." class="w-full mt-3 p-2 rounded-lg text-gray-800">
    </header>

    <!-- Section Annonces -->
    <main class="p-4">
        <div id="adsContainer" class="grid grid-cols-1 gap-4"></div>
        <div id="emptyAdsMessage" class="hidden text-center py-10 text-gray-500">Aucune annonce.</div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 text-gray-500 z-50">
        <a href="index.html" class="text-blue-600 flex flex-col items-center"><i class="fa-solid fa-house"></i><span class="text-[10px]">Accueil</span></a>
        <a href="rechercher.html" class="flex flex-col items-center"><i class="fa-solid fa-magnifying-glass"></i><span class="text-[10px]">Rechercher</span></a>
        <a href="publier.html" class="bg-blue-600 text-white rounded-full p-4 -mt-8 shadow-lg"><i class="fa-solid fa-plus"></i></a>
        <a href="favoris.html" class="flex flex-col items-center"><i class="fa-solid fa-heart"></i><span class="text-[10px]">Favoris</span></a>
        <a href="compte.html" class="flex flex-col items-center"><i class="fa-solid fa-user"></i><span class="text-[10px]">Compte</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8", authDomain: "universmarket-5834b.firebaseapp.com", projectId: "universmarket-5834b", storageBucket: "universmarket-5834b.appspot.com", messagingSenderId: "921170766621", appId: "1:921170766621:web:a4fdd73b9492d47a748c96" }));
        
        onSnapshot(query(collection(db, 'annonces'), orderBy('createdAt', 'desc')), (snapshot) => {
            const container = document.getElementById('adsContainer');
            const empty = document.getElementById('emptyAdsMessage');
            if (snapshot.empty) { empty.classList.remove('hidden'); container.innerHTML = ''; return; }
            empty.classList.add('hidden');
            container.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                return `<div class="bg-white p-3 rounded-xl shadow border">
                            <img src="${d.image}" class="w-full h-40 object-cover rounded">
                            <h4 class="font-bold">${d.title}</h4>
                            <p class="text-blue-600 font-bold">$${d.priceUSD}</p>
                        </div>`;
            }).join('');
        });
    </script>
</body>
</html>
