<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8",
        authDomain: "universmarket-5834b.firebaseapp.com",
        projectId: "universmarket-5834b",
        storageBucket: "universmarket-5834b.appspot.com",
        messagingSenderId: "921170766621",
        appId: "1:921170766621:web:a4fdd73b9492d47a748c96"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fonction pour afficher les annonces dans votre design
    window.renderAds = function(ads) {
        const container = document.getElementById('adsContainer');
        if (!container) return;
        
        container.innerHTML = ads.map(ad => `
            <div class="bg-white rounded-2xl shadow-sm border p-4">
                <img src="${ad.image}" class="w-full h-32 object-cover rounded-lg">
                <h4 class="font-bold mt-2">${ad.title}</h4>
                <p class="text-blue-600 font-bold">$${ad.priceUSD}</p>
            </div>
        `).join('');
    };

    // Charger les annonces
    const q = query(collection(db, 'annonces'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
        let ads = [];
        snapshot.forEach((doc) => ads.push({ id: doc.id, ...doc.data() }));
        window.renderAds(ads);
    });
</script>
