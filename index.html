<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniversMarket RDC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header / Navigation -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center gap-2">
                <div class="bg-white text-blue-600 p-2 rounded-lg shadow-inner">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">UniversMarket <span class="bg-white text-blue-600 text-xs px-1.5 py-0.5 rounded ml-1">RDC</span></h1>
                    <p class="text-xs text-blue-100">Marketplace RDC & Direct WhatsApp</p>
                </div>
            </div>
            <a href="#" class="border border-white/50 text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-white hover:text-blue-600 transition">Toute la RDC <i class="fa-solid fa-chevron-down ml-1 text-xs"></i></a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 md:p-6 max-w-6xl mx-auto pb-24">
        
        <!-- Search Bar -->
        <div class="relative mb-6">
            <input type="text" placeholder="Rechercher un produit, téléphone..." class="w-full p-3 pl-12 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-blue-200 outline-none transition">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>

        <!-- Banner / Hero -->
        <div class="bg-blue-600 text-white p-6 rounded-2xl mb-8 flex justify-between items-center shadow-lg">
            <div>
                <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Achat & Vente RDC</span>
                <h2 class="text-2xl font-extrabold mt-3 mb-1">WhatsApp Direct</h2>
                <p class="text-blue-100 text-sm mb-4">Contactez directement les vendeurs</p>
            </div>
            <button class="bg-white text-blue-600 font-bold px-5 py-3 rounded-xl shadow hover:bg-gray-50 transition"><i class="fa-solid fa-plus mr-2"></i> Publier</button>
        </div>

        <!-- Categories -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Catégories</h3>
                <a href="#" class="text-blue-600 text-sm font-medium">Voir tout</a>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center hover:shadow-md transition cursor-pointer">
                    <div class="text-blue-500 bg-blue-50 p-3 rounded-full mb-3"><i class="fa-solid fa-border-all text-xl"></i></div>
                    <span class="font-medium text-sm text-gray-700">Toutes</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center hover:shadow-md transition cursor-pointer">
                    <div class="text-blue-500 bg-blue-50 p-3 rounded-full mb-3"><i class="fa-solid fa-mobile-screen text-xl"></i></div>
                    <span class="font-medium text-sm text-gray-700">Téléphones</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center hover:shadow-md transition cursor-pointer">
                    <div class="text-blue-500 bg-blue-50 p-3 rounded-full mb-3"><i class="fa-solid fa-laptop text-xl"></i></div>
                    <span class="font-medium text-sm text-gray-700">Électronique</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center hover:shadow-md transition cursor-pointer">
                    <div class="text-blue-500 bg-blue-50 p-3 rounded-full mb-3"><i class="fa-solid fa-couch text-xl"></i></div>
                    <span class="font-medium text-sm text-gray-700">Meubles</span>
                </div>
            </div>
        </div>

        <!-- Recent Ads -->
        <div>
            <h3 class="text-lg font-bold text-gray-800 mb-4">Annonces récentes (0)</h3>
            <div class="text-center py-12 text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">
                <i class="fa-solid fa-box-open text-4xl mb-4 text-gray-300"></i>
                <p>Aucune annonce disponible.</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white p-3 border-t border-gray-100 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-50">
        <div class="flex justify-around items-center max-w-lg mx-auto relative">
            <a href="#" class="text-blue-600 flex flex-col items-center gap-1">
                <i class="fa-solid fa-home text-lg"></i>
                <span class="text-xs font-medium">Accueil</span>
            </a>
            <a href="#" class="text-gray-500 hover:text-blue-600 flex flex-col items-center gap-1 transition">
                <i class="fa-solid fa-search text-lg"></i>
                <span class="text-xs font-medium">Rechercher</span>
            </a>
            
            <!-- Publish Button (Center) -->
            <button class="bg-blue-600 text-white p-4 rounded-full shadow-lg absolute -top-7 left-1/2 -translate-x-1/2 border-4 border-white hover:bg-blue-700 transition">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
            <div class="w-16"></div> <!-- Spacer for the center button -->

            <a href="#" class="text-gray-500 hover:text-blue-600 flex flex-col items-center gap-1 transition">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-xs font-medium">Favoris</span>
            </a>
            <a href="#" class="text-gray-500 hover:text-blue-600 flex flex-col items-center gap-1 transition">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs font-medium">Compte</span>
            </a>
        </div>
    </nav>

</body>
</html>
