<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechercher - UniversMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-24">

    <!-- Header avec barre de recherche intégrée -->
    <header class="bg-blue-600 p-4 text-white shadow-md">
        <div class="flex items-center mb-3">
            <a href="index.html" class="mr-3 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="font-bold text-lg">Rechercher un produit</h1>
        </div>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Ex: iPhone, Spark, TV..." class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm text-gray-800 bg-white focus:outline-none shadow-sm" autofocus>
        </div>
    </header>

    <!-- Résultats de recherche -->
    <main class="p-4">
        <h3 class="font-bold text-gray-700 text-xs uppercase tracking-wider mb-3">Résultats de la recherche</h3>
        <div id="searchResults" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs shadow-sm">
                Commencez à taper dans la barre ci-dessus pour trouver une annonce.
            </div>
        </div>
    </main>

    <!-- Barre de navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-2 text-gray-400 z-50 shadow-lg">
        <a href="index.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Accueil</span>
        </a>
        <a href="rechercher.html" class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Rechercher</span>
        </a>
        <a href="publier.html" class="bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center -mt-5 shadow-lg">
            <i class="fa-solid fa-plus text-xl"></i>
        </a>
        <a href="favoris.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-heart text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Favoris</span>
        </a>
        <a href="compte.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Compte</span>
        </a>
    </nav>

    <!-- Script de recherche connectée à Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8",
            authDomain: "universmarket-5834b.firebaseapp.com",
            projectId: "universmarket-5834b",
            storageBucket: "universmarket-5834b.appspot.com",
            messagingSenderId: "921170766621",
            appId: "1:921170766621:web:a4fdd73b9492d47a748c96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allAds = [];

        async function fetchAllAds() {
            try {
                const querySnapshot = await getDocs(collection(db, 'annonces'));
                allAds = [];
                querySnapshot.forEach((doc) => {
                    allAds.push({ id: doc.id, ...doc.data() });
                });
            } catch (error) {
                console.error("Erreur de chargement:", error);
            }
        }

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            
            if (term === '') {
                searchResults.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs shadow-sm">Commencez à taper dans la barre ci-dessus pour trouver une annonce.</div>`;
                return;
            }

            const filtered = allAds.filter(ad => ad.title && ad.title.toLowerCase().includes(term));

            if (filtered.length === 0) {
                searchResults.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs shadow-sm">Aucun produit ne correspond à "${e.target.value}".</div>`;
                return;
            }

            searchResults.innerHTML = '';
            filtered.forEach(ad => {
                const phoneClean = ad.phone ? ad.phone.replace(/[^0-9]/g, '') : '';
                const whatsappUrl = `https://wa.me/${phoneClean}?text=Bonjour,%20je%20suis%20intéressé%20par%20votre%20annonce%20${encodeURIComponent(ad.title)}`;

                const card = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <img src="${ad.image || 'https://via.placeholder.com/400x300'}" alt="${ad.title}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-bold uppercase">${ad.category || 'Général'}</span>
                            <h3 class="font-bold text-gray-800 text-sm mt-1 mb-1">${ad.title}</h3>
                            <p class="text-blue-600 font-extrabold text-base mb-3">$${ad.priceUSD}</p>
                            <a href="${whatsappUrl}" target="_blank" class="w-full bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-2 shadow hover:bg-emerald-600 transition">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                                <span>Contacter</span>
                            </a>
                        </div>
                    </div>
                `;
                searchResults.innerHTML += card;
            });
        });

        // Charger les annonces dès l'ouverture de la page
        fetchAllAds();
    </script>
</body>
</html>
