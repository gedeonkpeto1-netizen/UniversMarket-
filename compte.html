<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - UniversMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-20">

    <!-- Header -->
    <header class="bg-blue-600 p-4 text-white flex items-center shadow-lg">
        <a href="index.html" class="mr-3 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="font-bold text-lg">Mon Compte</h1>
    </header>

    <!-- Contenu -->
    <main class="p-4 max-w-sm mx-auto mt-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center mb-4">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="font-bold text-gray-800 text-base">Utilisateur UniversMarket</h3>
            <p class="text-xs text-gray-500 mt-1">République Démocratique du Congo 🇨🇩</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <a href="#" class="flex items-center justify-between p-4 border-b border-gray-100 text-gray-700 hover:bg-gray-50 text-sm">

                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </a>
            <a href="#" class="flex items-center justify-between p-4 border-b border-gray-100 text-gray-700 hover:bg-gray-50 text-sm">
                <span><i class="fa-solid fa-circle-question mr-3 text-blue-600"></i>Aide & Support</span>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </a>
            <a href="#" class="flex items-center justify-between p-4 text-gray-700 hover:bg-gray-50 text-sm">
                <span><i class="fa-solid fa-shield-halved mr-3 text-blue-600"></i>Conditions d'utilisation</span>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </a>
        </div>
    </main>

    <!-- Barre de navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-2 text-gray-400 z-50 shadow-lg">
        <a href="index.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Accueil</span>
        </a>
        <a href="rechercher.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Rechercher</span>
        </a>
        <a href="publier.html" class="bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center -mt-5 shadow-lg">
            <i class="fa-solid fa-plus text-xl"></i>
        </a>
        <a href="favoris.html" class="flex flex-col items-center hover:text-gray-600">
            <i class="fa-solid fa-heart text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Favoris</span>
        </a>
        <a href="compte.html" class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Compte</span>
        </a>
    </nav>

</html>
