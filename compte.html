<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - UniversMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 pb-24 transition-colors duration-300">

    <header class="bg-blue-600 dark:bg-blue-900 p-4 text-white shadow-md flex items-center transition-colors duration-300">
        <a href="index.html" class="mr-3 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="font-bold text-lg">Mon Compte & Sécurité</h1>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- État de chargement initial -->
        <div id="loadingState" class="text-center py-10 text-gray-400 text-xs">
            Vérification de la session...
        </div>

        <!-- Section Connecté (Cachée par défaut) -->
        <div id="loggedInView" class="hidden space-y-4">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm text-center space-y-3 transition-colors duration-300">
                <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2 class="font-bold text-sm text-gray-700 dark:text-gray-200">Connecté en tant que :</h2>
                <p id="userEmailDisplay" class="text-blue-600 dark:text-blue-400 font-semibold text-xs break-all"></p>
                <button onclick="logoutUser()" class="w-full bg-red-500 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-red-600 transition mt-4">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Se déconnecter
                </button>
            </div>
        </div>

        <!-- Section Non Connecté (Formulaire Connexion / Inscription) -->
        <div id="loggedOutView" class="hidden space-y-4">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm transition-colors duration-300">
                <div class="flex border-b border-gray-100 dark:border-gray-700 mb-4">
                    <button id="tabLogin" onclick="switchTab('login')" class="flex-1 pb-2 font-bold text-xs text-blue-600 border-b-2 border-blue-600 transition">Connexion</button>
                    <button id="tabRegister" onclick="switchTab('register')" class="flex-1 pb-2 font-bold text-xs text-gray-400 transition">Inscription</button>
                </div>

                <div id="errorMsg" class="hidden mb-3 bg-red-50 text-red-500 text-[11px] p-2.5 rounded-xl text-center font-medium"></div>

                <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 mb-1">Email</label>
                        <input type="email5" id="emailInput" required placeholder="votre@email.com" class="w-full px-3 py-2.5 text-xs rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 mb-1">Mot de passe</label>
                        <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-3 py-2.5 text-xs rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-white focus:outline-none">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-xs shadow hover:bg-blue-700 transition mt-2">
                        Se connecter
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center py-2 text-gray-400 z-50 shadow-lg transition-colors duration-300">
        <a href="index.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Accueil</span>
        </a>
        <a href="rechercher.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Rechercher</span>
        </a>
        <a href="publier.html" class="bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center -mt-5 shadow-lg">
            <i class="fa-solid fa-plus text-xl"></i>
        </a>
        <a href="favoris.html" class="flex flex-col items-center hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-heart text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Favoris</span>
        </a>
        <a href="compte.html" class="flex flex-col items-center text-blue-600 dark:text-blue-400">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Compte</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUSW3HT16j3ESHu3k4RQjR42sVRflv5g8",
            authDomain: "universmarket-5834b.firebaseapp.com",
            projectId: "universmarket-5834b",
            storageBucket: "universmarket-5834b.appspot.com",
            messagingSenderId: "921170766621",
            appId: "1:921170766621:web:a4fdd73b9492d47a748c96"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = true;

        window.switchTab = function(mode) {
            isLoginMode = (mode === 'login');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            if (isLoginMode) {
                tabLogin.className = "flex-1 pb-2 font-bold text-xs text-blue-600 border-b-2 border-blue-600 transition";
                tabRegister.className = "flex-1 pb-2 font-bold text-xs text-gray-400 transition";
                submitBtn.textContent = "Se connecter";
            } else {
                tabRegister.className = "flex-1 pb-2 font-bold text-xs text-blue-600 border-b-2 border-blue-600 transition";
                tabLogin.className = "flex-1 pb-2 font-bold text-xs text-gray-400 transition";
                submitBtn.textContent = "S'inscrire";
            }
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("Connexion réussie !");
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Compte créé avec succès !");
                }
                window.location.href = "index.html";
            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Erreur : " + error.message;
                errorMsg.classList.remove('hidden');
            }
        }

        window.logoutUser = async function() {
            await signOut(auth);
            alert("Vous êtes déconnecté.");
            window.location.reload();
        }

        // Vérification de l'état de l'utilisateur en temps réel
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loadingState').classList.add('hidden');
            if (user) {
                document.getElementById('loggedInView').classList.remove('hidden');
                document.getElementById('loggedOutView').classList.add('hidden');
                document.getElementById('userEmailDisplay').textContent = user.email;
            } else {
                document.getElementById('loggedInView').classList.add('hidden');
                document.getElementById('loggedOutView').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
